spring:
  application:
    name: corporate-admin-panel

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admin_panel}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: false

  cache:
    type: simple

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-change-me-in-prod-change-me-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    com.corporate.admin: INFO
    org.springframework.security: INFO